[package]
name = "filmcraft-publish"
description = "FilmCraft publishing: upload exported media to video platforms (YouTube resumable uploads), over a transport trait with the HTTPS client behind the `net` feature"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# The HTTPS transport (pure-Rust TLS: rustls + RustCrypto, OS certificate verification), the same
# stack as filmcraft-speech's `download`. Off by default (and in wasm builds).
net = ["dep:ureq", "dep:rustls", "dep:rustls-rustcrypto"]
# The operating system's credential store for the signed-in account (Windows Credential Manager,
# macOS Keychain, a Secret Service on Linux), as craft-ai-integrations and craft-anything keep
# their keys. Off by default and in wasm builds: without it the account stays in a file.
keychain = ["dep:keyring"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = "0.23"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"], optional = true }
rustls = { version = "0.23", default-features = false, optional = true }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true }

# Signing in (PKCE verifiers and sign-in state from the operating system's random source, and a
# loopback listener) needs a desktop build.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
getrandom = "0.3"
keyring = { version = "4", optional = true }

[dev-dependencies]
# The integration tests drive the real HTTP transport against a local fake server.
filmcraft-publish = { path = ".", features = ["net"] }
